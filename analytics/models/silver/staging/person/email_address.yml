version: 2

sources:
  - name: silver_staging__person
    database: from-warehouse-to-lakehouse
    schema: silver_staging__person
    tables:
      - name: email_address
        description: "Where to send a person email"
        columns:
          - name: business_entity_id
            description: "Primary key. Person associated with this email address. Foreign key to Person.BusinessEntityID"
          - name: email_address_id
            description: "Primary key. ID of this email address"
          - name: email_address
            description: "E-mail address for the person"
          - name: row_guid
            description: "ROWGUIDCOL number uniquely identifying the record. Used to support a merge replication sample"
          - name: modified_date
            description: "Date and time the record was last updated"
          - name: _extract_date_
            description: "Timestamp when data was extracted from source"
          - name: date
            description: "Partition date for the record"