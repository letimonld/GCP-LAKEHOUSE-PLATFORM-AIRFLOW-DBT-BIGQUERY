version: 2

sources:
  - name: silver_staging__person
    database: from-warehouse-to-lakehouse
    schema: silver_staging__person
    tables:
      - name: password
        description: "One way hashed passwords for the Person table"
        columns:
          - name: business_entity_id
            description: "Primary key. Foreign key to Person.BusinessEntityID"
          - name: password_hash
            description: "Password for the e-mail account"
          - name: password_salt
            description: "Random value concatenated with the password string before the password is hashed"
          - name: row_guid
            description: "ROWGUIDCOL number uniquely identifying the record. Used to support a merge replication sample"
          - name: modified_date
            description: "Date and time the record was last updated"
          - name: _extract_date_
            description: "Timestamp when data was extracted from source"
          - name: date
            description: "Partition date for the record"