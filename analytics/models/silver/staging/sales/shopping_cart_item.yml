version: 2

sources:
  - name: silver_staging__sales
    database: from-warehouse-to-lakehouse
    schema: silver_staging__sales
    tables:
      - name: shopping_cart_item
        description: "Items in a customer's online shopping cart."
        columns:
          - name: shopping_cart_item_id
            description: "Primary key for ShoppingCartItem records."
          - name: shopping_cart_id
            description: "Shopping cart identification number."
          - name: quantity
            description: "Product quantity ordered."
          - name: product_id
            description: "Product ordered. Foreign key to Product.product_id."
          - name: date_created
            description: "Date and time the record was created."
          - name: modified_date
            description: "Date and time the record was last updated."