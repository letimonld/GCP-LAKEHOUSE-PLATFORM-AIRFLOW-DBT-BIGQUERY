version: 2

sources:
  - name: silver_staging__production
    database: from-warehouse-to-lakehouse
    schema: silver_staging__production
    tables:
      - name: product
        description: "Primary table for product information, including manufacturing details and pricing."
        columns:
          - name: product_id
            description: "Primary key for Product records."
          - name: name
            description: "Name of the product."
          - name: product_number
            description: "Unique product identification number."
          - name: make_flag
            description: "0 = Product is purchased, 1 = Product is manufactured in-house."
          - name: finished_goods_flag
            description: "0 = Product is not a salable item. 1 = Product is salable."
          - name: color
            description: "Product color."
          - name: safety_stock_level
            description: "Minimum inventory quantity."
          - name: reorder_point
            description: "Inventory level that triggers a purchase order or work order."
          - name: standard_cost
            description: "Standard cost of the product (Stored as STRING in BigQuery)."
          - name: list_price
            description: "Selling price (Stored as STRING in BigQuery)."
          - name: size
            description: "Product size."
          - name: size_unit_measure_code
            description: "Unit of measure for Size column."
          - name: weight_unit_measure_code
            description: "Unit of measure for Weight column."
          - name: weight
            description: "Product weight."
          - name: days_to_manufacture
            description: "Number of days required to manufacture the product."
          - name: product_line
            description: "R = Road, M = Mountain, T = Touring, S = Standard"
          - name: class
            description: "H = High, M = Medium, L = Low"
          - name: style
            description: "W = Womens, M = Mens, U = Universal"
          - name: product_subcategory_id
            description: "Product is a member of this product subcategory. Foreign key to ProductSubCategory."
          - name: product_model_id
            description: "Product is a member of this product model. Foreign key to ProductModel."
          - name: sell_start_date
            description: "Date the product was available for sale."
          - name: sell_end_date
            description: "Date the product was no longer available for sale."
          - name: discontinued_date
            description: "Date the product was discontinued."
          - name: row_guid
            description: "ROWGUIDCOL number uniquely identifying the record."
          - name: modified_date
            description: "Date and time the record was last updated."
          - name: _extract_date_
            description: "Timestamp when data was extracted from source"
          - name: date
            description: "Partition date for the record"