version: 2

sources:
  - name: silver_staging__human_resources
    database: from-warehouse-to-lakehouse
    schema: silver_staging__human_resources
    tables:
      - name: department
        description: "Department information from source system"
        columns:
          - name: department_id
            description: "Primary key for Department records"
          - name: name
            description: "Name of the department"
          - name: group_name
            description: "Name of the group to which the department belongs"
          - name: modified_date
            description: "Date and time the record was last updated"
          - name: _extract_date_
            description: "Timestamp when data was extracted from source"
          - name: date
            description: "Partition date for the record"
