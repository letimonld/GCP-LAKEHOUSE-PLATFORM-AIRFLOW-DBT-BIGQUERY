version: 2

sources:
  - name: silver_staging__human_resources
    database: from-warehouse-to-lakehouse
    schema: silver_staging__human_resources
    tables:
      - name: employee_department_history
        description: "Employee department transfers and history"
        columns:
          - name: business_entity_id
            description: "Employee identification number. Foreign key to Employee.BusinessEntityID"
          - name: department_id
            description: "Department in which the employee worked including currently. Foreign key to Department.DepartmentID"
          - name: shift_id
            description: "Identifies which 8-hour shift the employee works. Foreign key to Shift.Shift.ID"
          - name: start_date
            description: "Date the employee started work in the department"
          - name: end_date
            description: "Date the employee left the department. NULL = Current department"
          - name: modified_date
            description: "Date and time the record was last updated"
          - name: _extract_date_
            description: "Timestamp when data was extracted from source"
          - name: date
            description: "Partition date for the record"